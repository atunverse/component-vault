name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# 同一分支只保留最新一次构建，避免连续推送把队列堆满（实测 runner 排队会到 20 分钟以上）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore ci-debug.keystore \
            -storetype JKS \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass componentvault \
            -keypass componentvault \
            -dname "CN=ComponentVault CI, OU=Dev, O=Atun, L=Shenzhen, ST=Guangdong, C=CN"

      # Manifest 里的类名是纯字符串，AGP 编译期不校验。
      # 今天就是把 .VaultApplication 写成了 .VaultApp，编译全绿、装机秒退。
      - name: Check manifest component classes
        run: python3 tools/check_manifest.py .

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ || true
          ls -la out

      # 打包产物级复查：直接读 APK 内的二进制 Manifest 和 dex，
      # 确认启动类真的存在。前一道检查看源码，这一道看成品，双保险。
      - name: Verify APK launch config
        run: |
          set -e
          APK=$(ls out/*.apk | head -1)
          echo "检查 $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > manifest-dump.txt
          echo "--- application 节点 ---"
          grep -A6 'E: application' manifest-dump.txt | head -12 || true
          if ! grep -q 'com\.atun\.componentvault\.VaultApplication' manifest-dump.txt; then
            echo "::error::APK 内 application 指向的类不是 VaultApplication，装机会闪退"
            exit 1
          fi
          rm -rf apkx && mkdir apkx && unzip -o -q "$APK" 'classes*.dex' -d apkx
          if ! grep -qa 'Lcom/atun/componentvault/VaultApplication;' apkx/*.dex; then
            echo "::error::dex 里找不到 VaultApplication 类"
            exit 1
          fi
          echo "OK: Manifest 与 dex 都指向 VaultApplication"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: componentvault-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: ComponentVault ${{ github.ref_name }}
          body: |
            自动构建的调试签名 APK，可直接侧载安装。
            安装前需在手机上允许「安装未知来源应用」。
