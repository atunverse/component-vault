name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# 同一分支只保留最新一次构建，避免连续推送把队列堆满（实测 runner 排队会到 20 分钟以上）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 固定签名密钥。每次重建密钥会导致新包无法覆盖安装旧包（报「应用未安装」），
      # 用户只能卸载重装，库存数据全丢。所以密钥必须持久化，放在仓库 Secret 里。
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ci-debug.p12
            echo "已从 Secret 解码固定签名密钥"
          else
            echo "::warning::未配置 CI_KEYSTORE_B64，本次使用临时密钥，产物无法覆盖安装旧版本"
            openssl req -x509 -newkey rsa:2048 -days 10950 -nodes \
              -keyout /tmp/k.pem -out /tmp/c.pem \
              -subj "/CN=ComponentVault Temp, O=Atun, C=CN" 2>/dev/null
            openssl pkcs12 -export -in /tmp/c.pem -inkey /tmp/k.pem \
              -name ci -out ci-debug.p12 -passout pass:componentvault
          fi
          keytool -list -keystore ci-debug.p12 -storetype PKCS12 \
            -storepass componentvault | sed -n '1,6p'
          openssl pkcs12 -in ci-debug.p12 -nokeys -passin pass:componentvault 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256

      # Manifest 里的类名是纯字符串，AGP 编译期不校验。
      # 今天就是把 .VaultApplication 写成了 .VaultApp，编译全绿、装机秒退。
      - name: Check manifest component classes
        run: python3 tools/check_manifest.py .

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ || true
          ls -la out

      # 打包产物级复查：直接读 APK 内的二进制 Manifest 和 dex，
      # 确认启动类真的存在。前一道检查看源码，这一道看成品，双保险。
      - name: Verify APK launch config
        run: |
          set -e
          APK=$(ls out/*.apk | head -1)
          echo "检查 $APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > manifest-dump.txt
          echo "--- application 节点 ---"
          grep -A6 'E: application' manifest-dump.txt | head -12 || true
          if ! grep -q 'com\.atun\.componentvault\.VaultApplication' manifest-dump.txt; then
            echo "::error::APK 内 application 指向的类不是 VaultApplication，装机会闪退"
            exit 1
          fi
          rm -rf apkx && mkdir apkx && unzip -o -q "$APK" 'classes*.dex' -d apkx
          if ! grep -qa 'Lcom/atun/componentvault/VaultApplication;' apkx/*.dex; then
            echo "::error::dex 里找不到 VaultApplication 类"
            exit 1
          fi
          echo "OK: Manifest 与 dex 都指向 VaultApplication"

      # 签名指纹固定校验：密钥一旦变了，用户下次更新就会覆盖安装失败、数据丢失。
      # 与其等手机上撞见「应用未安装」，不如在构建时就拦住。
      - name: Verify APK signature
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | grep -i 'SHA-256' | head -3 || true
          DIGEST=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' \
            | tr -d ':' | tr 'A-Z' 'a-z')
          EXPECT="db2af5769c07e8b728756b54e451f11280f10ea0ca5fca869ac34069f1e6027f"
          if [ "$DIGEST" != "$EXPECT" ]; then
            echo "::error::签名指纹不符：实际 $DIGEST，期望 $EXPECT。换了密钥会导致老用户无法覆盖安装"
            exit 1
          fi
          echo "OK: 签名指纹与固定密钥一致"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: componentvault-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: ComponentVault ${{ github.ref_name }}
          body: |
            自动构建的调试签名 APK，可直接侧载安装。
            安装前需在手机上允许「安装未知来源应用」。
